<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="excelat-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>
    <linearGradient id="excelat-accent" x1="8" y1="8" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="excelat-cell" x1="12" y1="12" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242735"/>
      <stop offset="100%" stop-color="#161822"/>
    </linearGradient>
    <filter id="excelat-glow" x="2" y="2" width="28" height="24" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#excelat-bg)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Top Row (Top arm of E) -->
  <rect x="9" y="9" width="13" height="8" rx="2.5" fill="url(#excelat-accent)" filter="url(#excelat-glow)"/>
  <rect x="24" y="9" width="7" height="8" rx="2" fill="url(#excelat-cell)" stroke="#383d52" stroke-width="0.8"/>
  <rect x="33" y="9" width="6" height="8" rx="2" fill="url(#excelat-cell)" stroke="#383d52" stroke-width="0.8"/>

  <!-- Middle Row (Middle arm of E) -->
  <rect x="9" y="20" width="8" height="8" rx="2" fill="#10b981" fill-opacity="0.85"/>
  <rect x="19" y="20" width="12" height="8" rx="2" fill="url(#excelat-cell)" stroke="#383d52" stroke-width="0.8"/>

  <!-- Bottom Row (Bottom arm of E) -->
  <rect x="9" y="31" width="8" height="8" rx="2" fill="#059669" fill-opacity="0.9"/>
  <rect x="19" y="31" width="12" height="8" rx="2" fill="url(#excelat-cell)" stroke="#383d52" stroke-width="0.8"/>
  <rect x="33" y="31" width="6" height="8" rx="2" fill="url(#excelat-cell)" stroke="#383d52" stroke-width="0.8"/>

  <!-- Vertical Spine connector forming solid 'E' stem -->
  <rect x="9" y="15" width="4" height="7" fill="#10b981" fill-opacity="0.75"/>
  <rect x="9" y="26" width="4" height="7" fill="#059669" fill-opacity="0.75"/>
</svg>
